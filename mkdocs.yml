site_name: Spark of Madness
site_description: Character creation options for the Spark of Madness campaign.

docs_dir: docs

theme:
  name: material
  language: en
  features:
    - navigation.sections
    - navigation.top
    - search.suggest
    - search.highlight
    - toc.follow

markdown_extensions:
  - admonition
  - attr_list
  - md_in_html
  - meta
  - tables

nav:
  - Home: index.md
  - Subclasses:
      - Circle of the Cauldron: Content/SubClasses/CircleOfTheCauldron.md
      - Arcane Archer Revisited: Content/SubClasses/Arcane archer revisited.md
      - Card Bettor: Content/SubClasses/Card Bettor.md
      - Circle of the Displacer: Content/SubClasses/Circle of the Displacer.md
      - Oath of Splendor: Content/SubClasses/Oath of Splendor.md
      - Path of the Anvil: Content/SubClasses/Path of the anvil.md
      - School of the Cascade: Content/SubClasses/School of the cascade.md
      - Star Thrower: Content/SubClasses/Star thrower.md
      - Thirsty Blade Bloodline: Content/SubClasses/Thirsty blade bloodline.md
      - Underhand Blade: Content/SubClasses/Underhand blade.md
  - Races:
      - Kensut: Content/Races/Kensut.md
  - Items:
      - Bladed Buckler: Content/Equipment/Bladed Buckler.md
  - Feats: Content/Feats/Feats.md
  - References:
      - Sandstorm: 09-Other/Sandstorm.md
      - Displacer Circle Creatures:
          - Displacer Cub: 08-Monster/Fiches/Displacer Cub.md
          - Young Displacer Beast: 08-Monster/Fiches/Young Displacer Beast.md
          - Displacer Beast: 08-Monster/Fiches/Displacer Beast.md
          - Ancient Displacer Beast: 08-Monster/Fiches/Ancient Displacer Beast.md
          - Mythic Displacer Beast: 08-Monster/Fiches/Mythic Displacer Beast.md
