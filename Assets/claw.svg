<svg xmlns="http://www.w3.org/2000/svg" width="220" height="220" viewBox="0 0 220 220">
    <!-- Lignes -->
    <line x1="50" y1="180" x2="90" y2="90" stroke="white"/>
    <line x1="90" y1="90" x2="170" y2="50" stroke="white"/>

    <line x1="120" y1="180" x2="110" y2="140" stroke="white"/>
    <line x1="110" y1="140" x2="130" y2="100" stroke="white"/>
    <line x1="170" y1="50" x2="130" y2="100" stroke="white"/>

    <!-- Étoiles -->
    <circle cx="50" cy="180" r="4" fill="white"/>
    <circle cx="90" cy="90" r="4" fill="white"/>
    <circle cx="170" cy="50" r="4" fill="white"/>

    <circle cx="120" cy="180" r="4" fill="white"/>
    <circle cx="110" cy="140" r="4" fill="white"/>
    <circle cx="130" cy="100" r="4" fill="white"/>
</svg>